spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
azure:
  storage:
    connection-string: "UseDevelopmentStorage=true"
    posts-container: "test-posts"
    profiles-container: "test-profiles"
    task-images-container: "test-task-images"
    chat-images-container: "test-chat-images"
    report-container: "test-reports"