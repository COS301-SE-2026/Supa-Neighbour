springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true
  packages-to-scan: com.app.api.controllers

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/supadb
    username: supauser
    password: supapassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none #had to switch to none so it doesnt create new tables on top of the schema
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl #this helps stop it switching to snake_case
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    # The schema already exists (built by hand, not by Flyway). baseline-on-migrate
    # tells Flyway to record the CURRENT schema as a starting point the first time
    # it runs, instead of trying to run migrations that assume an empty database.
    baseline-on-migrate: true
    # Flyway only runs migrations with a version number strictly greater than the
    # baseline. baseline-version: 0 means "everything up to now is the baseline",
    # so a first migration named V1__... is the first thing Flyway actually runs.
    baseline-version: 0
    
supaneighbour:
  vision:
    mode: gemini
    stub:
      outcome: complete       # unused while mode is gemini, but harmless to leave
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.0-flash
      max-image-edge-px: 1600                  # downscale before sending (see §5.1)
      timeout-seconds: 30
  verification:
    geofence-radius-m: 75
    arrival-geofence-radius-m: 150
    task-window-grace-minutes: 30
    zone: Africa/Johannesburg
    weights:
      ai: 0.45
      geo: 0.25
      meta: 0.15
      time: 0.15
    thresholds:
      verified: 0.75
      needs-review: 0.45
    max-upload-bytes: 12582912
    allowed-mime: ["image/jpeg", "image/png"]




google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID.apps.googleusercontent.com}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}

server:
  port: 8080
management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health

