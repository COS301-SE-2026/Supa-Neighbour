spring:
  datasource: 
    url: jdbc:postgresql://parseandco-sqlserver.postgres.database.azure.com:5432/parseandco-database?sslmode=require
    username: parseandcosqlserveradmin20261206
    password: $(DB_PASSWORD)
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true