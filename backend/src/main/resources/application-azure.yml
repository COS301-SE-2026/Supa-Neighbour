spring:
  datasource: 
    url: jdbc:postgresql://parseandco-sqlserver.postgres.database.azure.com:5432/parseandco-database?sslmode=require
    username: parseandcosqlserveradmin20261206
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      max-lifetime: 600000
  jpa:
    hibernate:a
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
azure:
  storage:
    connection-string: ${BLOB_CONNECTION_STRING}
    posts-container: posts
    profiles-container: profiles
    task-images-container: task-images
    chat-images-container: chat-images
management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health