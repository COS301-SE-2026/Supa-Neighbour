        is recalculated after submission.
      operationId: rateTask
      parameters:
      - name: Authorization
        in: header
        description: "Firebase authentication token in format: 'Bearer <token>'"
        required: true
        schema:
          type: string
        example: Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6...
      - name: taskId
        in: path
        description: ID of the task being rated
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingRequest"
        required: true
      responses:
        "200":
          description: Rating submitted successfully
          content:
            '*/*':
              schema:
                type: object
        "400":
          description: Invalid rating data
          content:
            application/json:
              example:
                error: Rating must be between 1 and 5
        "401":
          description: Invalid or expired Firebase token
          content:
            text/plain:
              example: Invalid or expired Firebase token
        "403":
          description: Not authorized to rate this task
          content:
            application/json:
              example:
                error: You are not authorized to rate this task
        "404":
          description: Task not found or not completed
          content:
            application/json:
              example:
                error: Task not found or not completed
      security:
      - BearerAuth: []
