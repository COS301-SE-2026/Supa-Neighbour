        in: header
        description: "Firebase authentication token in format: 'Bearer <token>'"
        required: true
        schema:
          type: string
        example: Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6...
      responses:
        "200":
          description: Comments retrieved successfully
          content:
            '*/*':
              schema:
                type: object
        "401":
          description: Invalid or expired Firebase token
        "404":
          description: Post not found
      security:
      - BearerAuth: []
  /api/auth/profile:
    get:
      tags:
      - Authentication
      summary: Get current user profile
      description: Returns the profile of the currently authenticated user
      operationId: getProfile
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
  /api/settings/me/user:
    delete:
      tags:
      - Settings
      summary: Delete user account
      description: Permanently deletes the authenticated user's account and all associated
        data
      operationId: deleteUser_1
      parameters:
      - name: Authorization
        in: header
        description: "Firebase authentication token in format: 'Bearer <token>'"
        required: true
        schema:
          type: string
        example: Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6...
      responses:
        "204":
          description: Account deleted successfully
        "401":
          description: Invalid Firebase token
        "404":
          description: User not found
      security:
      - BearerAuth: []
  /api/comments/bulletin/posts/{postId}/{commentId}:
    delete:
      tags:
      - Comments
      summary: Delete a comment from a post
      description: Deletes a comment from a specific bulletin post
      operationId: deleteCommentsUnderPost_1
      parameters:
      - name: postId
        in: path
        description: ID of the bulletin post
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      - name: commentId
        in: path
        description: ID of the comment to delete
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      - name: Authorization
        in: header
        description: "Firebase authentication token in format: 'Bearer <token>'"
        required: true
        schema:
          type: string
        example: Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6...
      responses:
        "204":
          description: Comment deleted successfully
        "401":
          description: Invalid or expired Firebase token
        "404":
          description: Comment or post not found
