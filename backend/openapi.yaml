openapi: 3.1.0
info:
  title: Social App API
  description: API documentation for the Social App backend
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Admins
  description: Operations for managing administrators
- name: Authentication
  description: Endpoints for user authentication and account management
- name: Compatibility
  description: Operations for managing compatibility records
- name: Reactions
  description: Operations for managing post and comment reactions (likes/dislikes)
- name: Ratings
  description: Endpoints for submitting task ratings
- name: Image Upload
  description: Endpoints for uploading images to Azure Blob Storage
- name: Task Types
  description: Operations for managing task types
- name: Dependent Analytics
  description: Operations for managing dependent analytics records
- name: User Achievements
  description: Operations for managing user achievement records
- name: Helper Skills
  description: Operations for managing helper skills
- name: Suggestions
  description: Endpoints for retrieving suggested actions based on violation rules
- name: Swagger UI
  description: Redirect to Swagger UI documentation
- name: Task Invitations
  description: "Operations for managing task invitations, acceptances, and declines"
- name: Addresses
  description: Operations for managing addresses
- name: Analytics
  description: Operations for managing analytics records
- name: Tasks
  description: Operations for managing tasks
- name: Users
  description: Endpoints for managing user accounts
- name: User Profile
  description: Endpoints for retrieving and updating the authenticated user's profile
- name: Bulletin Posts
  description: Operations for managing bulletin board posts and comments
- name: Dependents
  description: Operations for managing dependents
- name: Locations
  description: Operations for managing locations
- name: Task Invoices
  description: Operations for managing task invoices
- name: Helper Profiles
  description: Endpoints for retrieving public helper profile information
- name: Leaderboard
  description: Endpoints for retrieving the application leaderboard
- name: Settings
  description: Endpoints for managing user application settings
- name: Badges
  description: Operations for managing badges
- name: Availability
  description: Operations for managing helper availability records
- name: Comments
  description: Operations for managing comments and reactions on bulletin posts
- name: Chats
  description: Operations for managing chat messages and threads
- name: Helper Analytics
  description: Operations for managing helper analytics records
- name: Helper Tasks
  description: Endpoints for retrieving helper task history
- name: Helpers
  description: Operations for managing helpers
paths:
  /tasks/{taskId}:
    get:
      tags:
      - Tasks
      summary: Get a task by ID
      description: "Retrieves a task by its ID, including resolved requester and helper\
        \ names"
      operationId: getTaskById
      parameters:
      - name: taskId
        in: path
        description: ID of the task to retrieve
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      responses:
        "200":
          description: Task found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaskDetailDTO"
        "404":
          description: Task not found
      security:
      - BearerAuth: []
    put:
      tags:
      - Tasks
      summary: Update task by ID
      description: Updates an existing task by its ID
      operationId: updateTask
      parameters:
      - name: taskId
        in: path
        description: ID of the task to update
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Task"
        required: true
      responses:
        "200":
          description: Task updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
        "400":
          description: Invalid task data
      security:
      - BearerAuth: []
    delete:
      tags:
      - Tasks
      summary: Delete a task by ID
      description: Deletes a task by its ID
      operationId: deleteTask
      parameters:
      - name: taskId
        in: path
        description: ID of the task to delete
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      responses:
        "200":
          description: Task deleted successfully
          content:
            '*/*':
              schema:
                type: string
        "404":
          description: Task not found
      security:
      - BearerAuth: []
  /api/users:
    get:
      tags:
      - Users
      summary: Get all users
      description: Retrieves a list of all users
      operationId: getAllUsers
      responses:
        "200":
          description: Successfully retrieved users
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    put:
      tags:
      - Users
      summary: Update authenticated user
      description: Updates the authenticated user's information
      operationId: updateUser
      parameters:
      - name: Authorization
        in: header
        description: "Firebase authentication token in format: 'Bearer <token>'"
        required: true
        schema:
          type: string
        example: Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6...
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
        required: true
      responses:
        "200":
          description: User updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid or expired Firebase token
        "404":
          description: User not found
        "400":
          description: Invalid user data
      security:
      - BearerAuth: []
    post:
      tags:
      - Users
      summary: Create a new user
      description: Creates a new user
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
        required: true
      responses:
        "201":
          description: User created successfully
          content:
            '*/*':
