      - Image Upload
      summary: Upload task image
      description: Uploads an image file associated with a task to Azure Blob Storage
      operationId: uploadTaskImage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "The image file to upload (JPEG, PNG, or GIF)"
              required:
              - file
      responses:
        "201":
          description: Image uploaded successfully
          content:
            application/json:
              example:
                imageUrl: https://storageaccount.blob.core.windows.net/container/tasks/image-123456.jpg
        "400":
          description: Invalid image file
          content:
            application/json:
              example:
                error: "File must be an image (JPEG, PNG, or GIF)"
        "500":
          description: Unexpected error during upload
          content:
            application/json:
              example:
                error: An unexpected error occurred. Please try again.
