name: Backend CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [ dev ]
jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -DskipTests -Dspring-boot.repackage.skip=true
        working-directory: backend
      
      - name: Run tests
        run: mvn test
        working-directory: backend
      
      - name: Lint
        run: mvn checkstyle:check
        working-directory: backend

  docker: 
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write Firebase service account key
        run: |
          mkdir -p backend/src/main/resources/Firebase
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > backend/src/main/resources/Firebase/serviceAccountKey.json
        
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: parseandcoregistry.azurecr.io
          username: ${{secrets.ACR_USERNAME}}
          password: ${{secrets.ACR_PASSWORD}}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: parseandcoregistry.azurecr.io/parseandco-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{ steps.meta.outputs.labels}}   

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy new image to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'parsebackend' # TODO: confirm exact Azure App Service name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} 
          images: 'parseandcoregistry.azurecr.io/parseandco-backend:sha-${{ github.sha }}'
