name: Backend CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [ dev ]
jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -DskipTests -Dspring-boot.repackage.skip=true
        working-directory: backend
      
      - name: Run tests
        run: mvn test
        working-directory: backend
      
      - name: Lint
        run: mvn checkstyle:check
        working-directory: backend

  openapi-diff:
    name: OpenAPI Contract Check
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: supadb
          POSTGRES_USER: supauser
          POSTGRES_PASSWORD: supapassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Load schema into CI database
        run: PGPASSWORD=supapassword psql -h localhost -U supauser -d supadb -f backend/schema.sql

      - name: Write Firebase service account key
        run: |
          mkdir -p backend/src/main/resources/Firebase
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > backend/src/main/resources/Firebase/serviceAccountKey.json

      - name: Build jar
        run: mvn clean package -DskipTests
        working-directory: backend

      - name: Start app in background
        run: |
          nohup java -jar target/*.jar > app.log 2>&1 &
          echo $! > app.pid
        working-directory: backend

      - name: Wait for app to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/api-docs.yaml > /dev/null; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app... ($i)"
            sleep 2
          done
          echo "App failed to start in time"
          cat backend/app.log
          exit 1

      - name: Fetch current OpenAPI spec
        run: curl -o openapi-current.yaml http://localhost:8080/api-docs.yaml

      - name: Stop app
        if: always()
        run: kill $(cat backend/app.pid) || true

      - name: Install oasdiff
        run: |
          curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh

      - name: Diff against committed baseline
        run: oasdiff breaking backend/openapi-baseline.yaml openapi-current.yaml --fail-on ERR

  docker: 
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    needs: [build-and-test, openapi-diff]
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write Firebase service account key
        run: |
          mkdir -p backend/src/main/resources/Firebase
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > backend/src/main/resources/Firebase/serviceAccountKey.json
        
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: parseandcoregistry.azurecr.io
          username: ${{secrets.ACR_USERNAME}}
          password: ${{secrets.ACR_PASSWORD}}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: parseandcoregistry.azurecr.io/parseandco-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{ steps.meta.outputs.labels}}   

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy new image to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'parsebackend' # TODO: confirm exact Azure App Service name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} 
          images: 'parseandcoregistry.azurecr.io/parseandco-backend:sha-${{ github.sha }}'
