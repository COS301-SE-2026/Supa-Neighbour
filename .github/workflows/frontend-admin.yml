name: Admin CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'shared/**'          # shared changes should trigger a rebuild too
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'shared/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'   # matches frontend/ pin

      - name: Get dependencies
        working-directory: admin
        run: flutter pub get

      - name: Analyze
        working-directory: admin
        run: flutter analyze

      - name: Build web
        working-directory: admin
        run: flutter build web --release
        # add --dart-define=API_BASE_URL=... here if the admin app
        # needs a different backend URL flag than frontend/

      - name: Deploy to Azure Static Web Apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'admin/build/web'
          skip_app_build: true