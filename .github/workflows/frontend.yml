name: Frontend CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/lib/screens/landing/**'
      - 'frontend/lib/screens/style_guide/**'
      - 'frontend/lib/main_landing.dart'
      - 'frontend/lib/main_style_guide.dart'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/lib/screens/landing/**'
      - 'frontend/lib/screens/style_guide/**'
      - 'frontend/lib/main_landing.dart'
      - 'frontend/lib/main_style_guide.dart'

jobs:
  build:
    name: Lint & Sanity Build
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
      
      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend
      
      - name: Lint
        run: flutter analyze
        working-directory: frontend
  
  deploy-landing: 
    name: Deploy Landing Page
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
        
      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend
        
      - name: Build landing page
        run: flutter build web -t lib/main_landing.dart
        working-directory: frontend
        
      - name: Deploy to Azure Static Web Apps
        run: npx @azure/static-web-apps-cli deploy ./build/web --deployment-token "$DEPLOYMENT_TOKEN" --env production
        working-directory: frontend
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.SWA_LANDING_TOKEN }}
  
  deploy-styleguide:
    name: Deploy Style Guide
    runs-on: ubuntu-lates
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
        
      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend
        
      - name: Build landing page
        run: flutter build web -t lib/main_style_guide.dart
        working-directory: frontend

      - name: Deploy to Azure Static Web Apps
        run: npx @azure/static-web-apps-cli deploy ./build/web --deployment-token "$DEPLOYMENT_TOKEN" --env production
        working-directory: frontend
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.SWA_STYLEGUIDE_TOKEN }}

    
