name: Frontend App CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/lib/**'
      - '!frontend/lib/screens/landing/**'
      - '!frontend/lib/screens/style_guide/**'
      - '!frontend/lib/main_landing.dart'
      - '!frontend/lib/main_style_guide.dart'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/lib/**'
      - '!frontend/lib/screens/landing/**'
      - '!frontend/lib/screens/style_guide/**'
      - '!frontend/lib/main_landing.dart'
      - '!frontend/lib/main_style_guide.dart'

jobs:
  build-and-test:
    name: Lint, Test & Sanity Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Lint
        run: flutter analyze
        working-directory: frontend

      - name: Run tests
        run: flutter test
        working-directory: frontend

      - name: Sanity build (main app)
        run: flutter build web -t lib/main.dart
        working-directory: frontend