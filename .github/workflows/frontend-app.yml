name: Frontend App CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/lib/**'
      - '!frontend/lib/screens/landing/**'
      - '!frontend/lib/screens/style_guide/**'
      - '!frontend/lib/main_landing.dart'
      - '!frontend/lib/main_style_guide.dart'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/lib/**'
      - '!frontend/lib/screens/landing/**'
      - '!frontend/lib/screens/style_guide/**'
      - '!frontend/lib/main_landing.dart'
      - '!frontend/lib/main_style_guide.dart'

jobs:
  build-and-test:
    name: Lint, Test & Sanity Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Lint
        run: flutter analyze
        working-directory: frontend

      - name: Run tests
        run: flutter test
        working-directory: frontend

      - name: Sanity build (main app)
        run: flutter build web -t lib/main.dart
        working-directory: frontend

  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Build release APK
        run: flutter build apk --release -t lib/main.dart
        working-directory: frontend

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk supa-neighbour.apk
        working-directory: frontend

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "label=Latest Build" >> $GITHUB_OUTPUT
          else
            echo "tag=latest-dev" >> $GITHUB_OUTPUT
            echo "label=Latest Dev Build" >> $GITHUB_OUTPUT
          fi

      - name: Replace release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ steps.tag.outputs.tag }} --yes --cleanup-tag || echo "No existing release for ${{ steps.tag.outputs.tag }}, continuing"
          gh release create ${{ steps.tag.outputs.tag }} frontend/supa-neighbour.apk \
            --title "${{ steps.tag.outputs.label }} ($(date +'%Y-%m-%d %H:%M'))" \
            --notes "Automatically built from commit ${{ github.sha }}" \
            --prerelease